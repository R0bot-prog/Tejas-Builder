<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello, Tejas!</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;800;900&display=swap");

      :root { --ink: #282436; --sky: #55c9f1; --red: #e9413c; --yellow: #ffd342; --green: #73bf45; }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh; margin: 0; overflow: hidden; color: var(--ink);
        font-family: "Nunito", system-ui, sans-serif;
        background: linear-gradient(var(--sky) 0 72%, #9cda60 72% 78%, #72bb49 78%);
      }
      .scene { position: relative; isolation: isolate; min-height: 100vh; display: grid; place-items: center; padding: 32px; }
      .cloud { position: absolute; z-index: -1; width: 138px; height: 35px; background: #fff; border-radius: 99px; opacity: .94; }
      .cloud::before, .cloud::after { content: ""; position: absolute; bottom: 0; background: inherit; border-radius: 50%; }
      .cloud::before { width: 64px; height: 64px; left: 20px; } .cloud::after { width: 48px; height: 48px; right: 16px; }
      .cloud.one { top: 13%; left: 8%; transform: scale(.8); } .cloud.two { top: 22%; right: 9%; transform: scale(1.05); }
      .cloud.three { top: 54%; left: 17%; transform: scale(.56); }
      .hills { position: absolute; z-index: -1; bottom: 19%; left: 0; width: 100%; height: 210px; overflow: hidden; }
      .hill { position: absolute; bottom: 0; width: 360px; height: 225px; background: #67b943; border-radius: 52% 52% 0 0; border: 5px solid #3d9638; }
      .hill::after { content: ""; position:absolute; width: 70px; height: 32px; background:#8fd557; border-radius: 50%; top: 47px; left: 77px; box-shadow: 72px 34px 0 -4px #8fd557; }
      .hill.left { left: -100px; } .hill.right { right: -105px; transform: scale(.78); transform-origin: bottom; }
      .card {
        position: relative; width: min(650px, 100%); text-align: center; padding: 36px 42px 44px;
        background: #fff7df; border: 6px solid var(--ink); border-radius: 25px;
        box-shadow: 0 9px 0 var(--ink), 0 18px 0 rgba(39, 35, 53, .16);
      }
      .rivet { position:absolute; width:16px; height:16px; border:3px solid var(--ink); border-radius:50%; background:#f1b73f; top:14px; }
      .rivet.a { left: 16px; } .rivet.b { right: 16px; }
      .badge { display:inline-flex; align-items:center; gap:9px; padding: 7px 15px; border-radius:999px; background: var(--red); color:white; font-size:.83rem; font-weight:900; letter-spacing:.08em; text-transform:uppercase; box-shadow: 0 3px 0 #a82d32; }
      .badge span { color: var(--yellow); font-size:1.1rem; line-height:1; }
      h1 { margin: 19px 0 8px; font: clamp(3.2rem, 10vw, 6.9rem)/.9 "Fredoka One", "Arial Rounded MT Bold", sans-serif; letter-spacing: -.055em; color: var(--red); text-shadow: 3px 3px 0 #fff, 6px 6px 0 var(--ink); }
      .tejas { color: var(--green); }
      .subtitle { margin: 17px auto 23px; max-width: 440px; font-size: clamp(1rem, 2.5vw, 1.2rem); font-weight: 800; }
      .coins { display:flex; justify-content:center; gap: 13px; }
      .coin { display:grid; place-items:center; width:40px; height:40px; border:4px solid var(--ink); border-radius:50%; background:var(--yellow); color:#ee9e28; font-size:1.5rem; font-weight:900; box-shadow: inset 0 0 0 3px #ffe989, 0 3px 0 var(--ink); }
      .block { position:absolute; bottom: 8.5%; width: 74px; height:74px; display:grid; place-items:center; background:var(--yellow); border:5px solid var(--ink); color:white; font: 3rem/1 "Fredoka One", sans-serif; text-shadow: 2px 2px 0 #e5a92b; box-shadow: inset 0 0 0 4px #ffe87d, 0 5px 0 rgba(40,36,54,.45); }
      .block::before { content:""; position:absolute; inset:9px; border:2px solid #e6ac28; } .block.question { left: 12%; } .block.brick { right:12%; background:#c96d3e; }
      .block.brick::before { border-color:#8e4631; background: linear-gradient(90deg, transparent 47%, #8e4631 47% 53%, transparent 53%), linear-gradient(transparent 47%, #8e4631 47% 53%, transparent 53%); }
      .ground { position:absolute; bottom:0; height: 10%; width:100%; background: repeating-linear-gradient(90deg, #61a83d 0 48px, #4e9937 48px 54px); border-top:7px solid var(--ink); z-index:-1; }
      @media (max-width: 600px) { .card { padding: 32px 22px 34px; } .block { transform:scale(.65); } .block.question { left:-5px; } .block.brick { right:-5px; } .cloud.two { right:-45px; } }
    </style>
  </head>
  <body>
    <main class="scene">
      <div class="cloud one"></div><div class="cloud two"></div><div class="cloud three"></div>
      <div class="hills"><div class="hill left"></div><div class="hill right"></div></div>
      <section class="card" aria-labelledby="greeting">
        <i class="rivet a"></i><i class="rivet b"></i>
        <div class="badge"><span>★</span> Player one ready <span>★</span></div>
        <h1 id="greeting">Hello,<br /><span class="tejas">Tejas!</span></h1>
        <p class="subtitle">Your next adventure starts right here. Let’s-a go!</p>
        <div class="coins" aria-label="Three collected coins"><span class="coin">I</span><span class="coin">I</span><span class="coin">I</span></div>
      </section>
      <div class="block question" aria-hidden="true">?</div><div class="block brick" aria-hidden="true"></div><div class="ground"></div>
    </main>
  </body>
</html>
