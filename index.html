<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deep Sea Explorers</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,700;9..144,800&family=Manrope:wght@600;700;800&display=swap");

      :root { --navy:#062946; --ink:#06243d; --aqua:#5ee6e1; --mist:#d5f8f3; --coral:#ff8066; --gold:#ffd36a; }
      * { box-sizing: border-box; }
      body { margin:0; min-height:100vh; overflow:hidden; color:var(--mist); font-family:Manrope,system-ui,sans-serif; background:#083c60; }
      .ocean { position:relative; isolation:isolate; min-height:100vh; display:grid; place-items:center; overflow:hidden; background:linear-gradient(180deg,#0b5574 0%,#063c61 38%,#042b4e 100%); }
      .rays { position:absolute; inset:0; z-index:-4; opacity:.24; background:linear-gradient(112deg,transparent 0 36%,#aaf5e7 36.2% 40%,transparent 40.2% 52%,#aaf5e7 52.2% 55%,transparent 55.2% 68%,#aaf5e7 68.2% 71%,transparent 71.2%); clip-path:polygon(12% 0,88% 0,76% 75%,24% 75%); }
      .bubble { position:absolute; z-index:-1; border:1px solid rgba(205,255,247,.64); border-radius:50%; background:radial-gradient(circle at 32% 25%,rgba(255,255,255,.75),rgba(123,234,232,.15) 24%,transparent 62%); box-shadow:inset -5px -7px 12px rgba(6,41,70,.18); animation:float 7s ease-in-out infinite; }
      .bubble.a { width:41px;height:41px;top:13%;left:12%; }.bubble.b { width:17px;height:17px;top:29%;left:20%;animation-delay:-2s }.bubble.c { width:64px;height:64px;right:12%;top:18%;animation-delay:-4s }.bubble.d { width:25px;height:25px;right:20%;bottom:19%;animation-delay:-1s }.bubble.e { width:12px;height:12px;left:30%;bottom:25%; }
      .card { position:relative; width:min(780px,calc(100% - 40px)); padding:48px 65px 42px; text-align:center; border:1px solid rgba(154,242,235,.55); border-radius:30px; background:linear-gradient(135deg,rgba(15,87,111,.85),rgba(4,43,76,.9)); box-shadow:0 24px 75px rgba(0,17,39,.38),inset 0 1px 0 rgba(255,255,255,.16); backdrop-filter:blur(8px); }
      .porthole { position:absolute; display:grid; place-items:center; width:52px;height:52px; border:5px solid #e5d0a0; border-radius:50%; background:#0b7290; box-shadow:0 0 0 3px #a27e51, inset 0 0 0 5px #06496c; }
      .porthole::after { content:"";width:8px;height:8px;border-radius:50%;background:#9b7549;box-shadow:0 -15px #9b7549,0 15px #9b7549,15px 0 #9b7549,-15px 0 #9b7549; }.porthole.left {left:27px;top:27px}.porthole.right {right:27px;top:27px}
      .eyebrow { display:inline-flex; align-items:center; gap:9px; margin:3px 0 18px; color:var(--aqua); font:500 .72rem/1.2 "DM Mono",monospace; letter-spacing:.18em; text-transform:uppercase; }.eyebrow::before,.eyebrow::after { content:"";width:27px;height:1px;background:currentColor;opacity:.7; }
      h1 { max-width:650px; margin:0 auto; font:800 clamp(3rem,7vw,5.8rem)/.94 Fraunces,Georgia,serif; letter-spacing:-.065em; color:#ecfff9; text-shadow:0 3px 0 rgba(0,39,69,.2); }
      h1 em { color:var(--aqua); font-style:normal; } .tagline { max-width:480px;margin:24px auto 27px; color:#bdece9; font-size:clamp(.92rem,2vw,1.07rem);line-height:1.7; }
      .coordinates { display:inline-flex; gap:12px; align-items:center; padding:10px 17px; border:1px solid rgba(127,223,218,.34); border-radius:999px; color:#d3f6ee; background:rgba(3,34,62,.28); font:500 .72rem "DM Mono",monospace; letter-spacing:.06em; }.compass { color:var(--gold);font-size:1rem; }
      .seafloor { position:absolute;bottom:-35px;left:-3%;z-index:-2;width:106%;height:173px;background:#082d4d;border-radius:50% 50% 0 0 / 28% 28% 0 0;box-shadow:0 -10px 0 #0c4b69; }
      .coral { position:absolute; bottom:24px; z-index:-1; width:110px;height:150px; background:var(--coral); border-radius:48% 48% 12px 12px; transform-origin:bottom; }.coral::before,.coral::after { content:"";position:absolute;bottom:48px;width:43px;height:100px;background:inherit;border-radius:50px 50px 8px 8px; }.coral::before {left:-21px;transform:rotate(-24deg)}.coral::after{right:-20px;transform:rotate(27deg)}.coral.one{left:8%;transform:scale(.75)}.coral.two{right:9%;bottom:16px;background:#e85d74;transform:scale(.58)}
      .fish { position:absolute;z-index:-1;top:24%;right:10%;width:66px;height:36px;border-radius:60% 45% 45% 60%;background:var(--gold);transform:rotate(-10deg);animation:swim 11s ease-in-out infinite; }.fish::before{content:"";position:absolute;right:-22px;top:7px;border:12px solid transparent;border-right:0;border-left:24px solid var(--gold)}.fish::after{content:"";position:absolute;left:12px;top:11px;width:5px;height:5px;border-radius:50%;background:#073756}.fish.small{top:63%;right:auto;left:8%;background:var(--aqua);transform:scale(.55) rotate(8deg);animation-delay:-4s}.fish.small::before{border-left-color:var(--aqua)}
      @keyframes float {50%{transform:translateY(-18px) translateX(5px)}} @keyframes swim {50%{translate:-23px 9px}}
      @media (max-width:620px){.card{padding:62px 28px 35px}.porthole{width:42px;height:42px;border-width:4px}.porthole.left{left:17px;top:17px}.porthole.right{right:17px;top:17px}.seafloor{height:130px}.coral.one{left:-2%}.coral.two{right:-5%}.fish{right:-6%}}
    </style>
  </head>
  <body>
    <main class="ocean">
      <div class="rays"></div><i class="bubble a"></i><i class="bubble b"></i><i class="bubble c"></i><i class="bubble d"></i><i class="bubble e"></i>
      <div class="fish" aria-hidden="true"></div><div class="fish small" aria-hidden="true"></div>
      <section class="card" aria-labelledby="welcome-title">
        <span class="porthole left" aria-hidden="true"></span><span class="porthole right" aria-hidden="true"></span>
        <p class="eyebrow">Oceanographic Society</p>
        <h1 id="welcome-title">Welcome all<br><em>Deep Sea Explorers</em></h1>
        <p class="tagline">Below the surface, a world of wonder awaits. Ready your submersible and follow the glow into the blue.</p>
        <div class="coordinates"><span class="compass">✦</span> 36° 18' N &nbsp;·&nbsp; 25° 20' W <span class="compass">✦</span></div>
      </section>
      <div class="coral one" aria-hidden="true"></div><div class="coral two" aria-hidden="true"></div><div class="seafloor" aria-hidden="true"></div>
    </main>
  </body>
</html>
